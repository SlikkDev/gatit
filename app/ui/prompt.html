<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Record this call?</title>
  <link rel="stylesheet" href="prompt.css">
</head>
<body>
  <div class="card" id="card">
    <div class="glyph"><span></span></div>
    <div class="text">
      <div class="title" id="title">Call started</div>
      <div class="sub">Record and transcribe it?</div>
    </div>
    <div class="buttons">
      <button id="dismiss" class="ghost">Not now</button>
      <button id="record" class="record">Record</button>
    </div>
    <div class="countdown"><div id="countdown"></div></div>
  </div>
  <script src="prompt.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gatit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar">
    <div class="record-bar">
      <button id="record" class="record" title="Start or stop recording">
        <span class="dot"></span><span id="record-label">Record</span>
      </button>
      <span id="timer">00:00</span>
    </div>
    <div class="meters" id="meters" hidden>
      <span>Me</span><div class="meter"><div id="meter-mic"></div></div>
      <span>Them</span><div class="meter"><div id="meter-system"></div></div>
    </div>
    <div id="notice" class="notice" hidden></div>
    <input id="search" type="search" placeholder="Search calls" autocomplete="off">
    <nav id="meetings"></nav>
    <footer>
      <button id="open-settings" class="link">Settings</button>
      <button id="open-folder" class="link">Meetings folder</button>
    </footer>
  </aside>

  <main id="main">
    <section id="empty" class="empty">
      <h2>No call selected</h2>
      <p>When a call starts, Gatit asks whether to record it. You can also press <b>Record</b> or use <kbd id="shortcut-hint"></kbd> at any time. Gatit records your microphone as "Me" and whatever the Mac plays as "Them", with no bot joining the call.</p>
      <p id="empty-hint" class="muted"></p>
    </section>

    <section id="detail" hidden>
      <header class="detail-header">
        <input id="title" class="title" spellcheck="false">
        <div class="meta">
          <span id="when"></span>
          <select id="source-app">
            <option value="">Unknown app</option>
            <option>Zoom</option>
            <option>Meet</option>
            <option>WhatsApp</option>
            <option>Phone</option>
            <option>Other</option>
          </select>
          <span id="status-pill" class="pill"></span>
        </div>
        <div id="progress" class="progress" hidden>
          <div class="bar"><div id="progress-fill"></div></div>
          <span id="progress-label"></span>
        </div>
        <div id="error" class="error" hidden></div>
        <div class="actions">
          <button id="summarize">Summarize</button>
          <button id="copy-summary">Copy summary</button>
          <button id="transcribe" title="Transcribe again">Re-transcribe</button>
          <select id="language" title="Transcription language">
            <option value="he">Hebrew</option>
            <option value="en">English</option>
            <option value="auto">Auto</option>
          </select>
          <button id="reveal">Show in Finder</button>
          <button id="delete" class="danger">Delete</button>
        </div>
      </header>

      <div class="player" id="player" hidden>
        <button id="play" class="play">▶</button>
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
        <span id="player-time">00:00</span>
      </div>

      <article id="summary" class="summary"></article>
      <article id="transcript" class="transcript"></article>
    </section>

    <section id="settings" hidden>
      <h2>Settings</h2>

      <h3>Recording</h3>
      <label><input id="s-ask" type="checkbox"> Ask to record when a Zoom, Meet or WhatsApp call starts
        <small>A small pop-up appears in the top-right corner. Gatit notices calls by which app is using the microphone; it never joins them.</small>
      </label>
      <label>Start/stop shortcut
        <input id="s-shortcut" placeholder="Control+Alt+Super+R">
        <small>Use Tauri key names, for example <code>Control+Alt+Super+R</code> (Super is the Command key).</small>
      </label>

      <h3>Transcription</h3>
      <label>Language of new calls
        <select id="s-language">
          <option value="he">Hebrew (with English terms)</option>
          <option value="en">English</option>
          <option value="auto">Detect from the call</option>
        </select>
      </label>
      <label>Hebrew model
        <select id="s-model">
          <option value="compressed">Compressed (faster, recommended on Intel Macs)</option>
          <option value="full">Full (slower, slightly more accurate)</option>
        </select>
      </label>
      <label>When to transcribe
        <select id="s-when">
          <option value="now">Right after the call</option>
          <option value="on_power">When the Mac is plugged in</option>
          <option value="manual">Only when I ask</option>
        </select>
      </label>
      <div id="models" class="models"></div>
      <label>Vocabulary (one per line: <code>Term = Hebrew spelling, another spelling</code>)
        <textarea id="s-vocab" rows="6" spellcheck="false"></textarea>
        <small>Terms are given to Whisper as a hint and any Hebrew-letter spellings are rewritten to the term.</small>
      </label>

      <h3>Summaries</h3>
      <label>Claude API key
        <input id="s-key" type="password" placeholder="sk-ant-…" autocomplete="off">
        <small id="key-status"></small>
      </label>
      <label><input id="s-auto" type="checkbox"> Summarize automatically after transcribing</label>
      <label>Claude model <input id="s-claude-model"></label>
      <button id="edit-prompt" class="link">Edit the summary instructions</button>

      <div class="actions">
        <button id="save-settings" class="primary">Save</button>
        <button id="close-settings">Cancel</button>
      </div>
      <p id="settings-message" class="muted"></p>
      <p id="about" class="muted"></p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>

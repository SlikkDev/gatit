[package]
name = "gatit"
version = "0.1.0"
description = "Record, transcribe and summarize calls without a bot joining them"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt", "process", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
regex = "1"
trash = "5"
url = "2"
open = "5"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

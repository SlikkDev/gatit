name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Rust checks and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            recorder-win
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: App format and lint
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --tests -- -D warnings
      - name: App unit tests (transcript merge, Hebrew search, summary parsing)
        working-directory: app/src-tauri
        run: cargo test
      - name: Windows recorder format, lint (for Windows too) and tests
        working-directory: recorder-win
        run: |
          cargo fmt --check
          cargo clippy --tests -- -D warnings
          cargo clippy --tests --target x86_64-pc-windows-msvc -- -D warnings
          cargo test

  mac:
    name: Gatit.app (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: .build/whisper.cpp
          key: whisper-cpp-${{ matrix.target }}-${{ hashFiles('scripts/build-whisper-mac.sh') }}
      - name: Build Swift recorder
        run: scripts/build-recorder-mac.sh ${{ matrix.target }}
      - name: Build whisper.cpp
        run: scripts/build-whisper-mac.sh ${{ matrix.target }}
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build app bundle
        working-directory: app/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles app
      - name: Zip app (keeps executable permissions)
        run: ditto -c -k --keepParent app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Gatit.app Gatit-macos-${{ matrix.name == 'Intel' && 'intel' || 'apple-silicon' }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Gatit-macos-${{ matrix.name == 'Intel' && 'intel' || 'apple-silicon' }}
          path: Gatit-macos-*.zip

  windows:
    name: Gatit installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            recorder-win
      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: .build/whisper.cpp
          key: whisper-cpp-x86_64-pc-windows-msvc-${{ hashFiles('scripts/build-whisper-windows.ps1') }}
      - name: Build recorder
        run: ./scripts/build-recorder-windows.ps1
      - name: Build whisper.cpp
        run: ./scripts/build-whisper-windows.ps1
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        working-directory: app/src-tauri
        run: cargo tauri build --bundles nsis
      - name: Collect installer
        run: Copy-Item (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName Gatit-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Gatit-windows
          path: Gatit-windows-setup.exe

  release:
    name: Publish downloads
    needs: [test, mac, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Gatit-*
          path: dist
          merge-multiple: true
      - name: Replace the "latest" pre-release with this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from commit ${GITHUB_SHA::7}. Pick **Gatit-macos-apple-silicon.zip** for a Mac with an Apple chip, **Gatit-macos-intel.zip** for an Intel Mac, or **Gatit-windows-setup.exe** for Windows. The builds are not signed by Apple or Microsoft, so the first launch needs a couple of extra clicks: see [Getting the app](https://github.com/${GITHUB_REPOSITORY}#getting-the-app)."

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests produce unsigned CI artifacts. Only main can use signing credentials
# or publish, and missing/invalid signing configuration fails the release.
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
env:
  GATIT_VERSION: 0.2.${{ github.run_number }}
  GATIT_MODE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'release' || 'ci' }}

jobs:
  test:
    name: Rust checks and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            recorder-win
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: Release pipeline regression tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          node --test scripts/tests/*.test.cjs
      - name: App format and lint
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --tests -- -D warnings
      - name: App unit tests (transcript merge, Hebrew search, summary parsing)
        working-directory: app/src-tauri
        run: |
          cargo test
          cargo clippy --tests --features microsoft-store -- -D warnings
          cargo test --features microsoft-store
      - name: Windows recorder format, lint (for Windows too) and tests
        working-directory: recorder-win
        run: |
          cargo fmt --check
          cargo clippy --tests -- -D warnings
          cargo clippy --tests --target x86_64-pc-windows-msvc -- -D warnings
          cargo test

  mac:
    name: Gatit.app (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            slug: intel
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            slug: apple-silicon
    steps:
      - uses: actions/checkout@v4
      - name: Expose release credentials
        if: env.GATIT_MODE == 'release'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/ci-export-secrets.sh APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      - name: Require Developer ID and notarization for releases
        run: scripts/ci-build-config.sh "$GATIT_VERSION" macos "$GATIT_MODE" > build-config.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: .build/whisper.cpp
          key: whisper-cpp-${{ matrix.target }}-${{ hashFiles('scripts/build-whisper-mac.sh') }}
      - name: Build Swift recorder
        run: scripts/build-recorder-mac.sh ${{ matrix.target }}
      - name: Build whisper.cpp
        run: scripts/build-whisper-mac.sh ${{ matrix.target }}
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.3 --locked
      - name: Build app bundle
        working-directory: app/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles app --config ../../build-config.json
      - name: Collect the app and the update package
        run: scripts/ci-collect-mac.sh ${{ matrix.target }} ${{ matrix.slug }} "$GATIT_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GATIT_MODE == 'release' && 'Gatit' || 'CI-unsigned-Gatit' }}-macos-${{ matrix.slug }}
          path: |
            Gatit-macos-${{ matrix.slug }}.zip
            Gatit-macos-${{ matrix.slug }}.app.tar.gz
            Gatit-macos-${{ matrix.slug }}.app.tar.gz.sig
            Gatit-macos-${{ matrix.slug }}.verification.json

  windows:
    name: Gatit installer (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Test Authenticode failure handling
        shell: pwsh
        run: |
          ./scripts/tests/verify-windows.tests.ps1
          ./scripts/tests/signing-hook.tests.ps1
      - name: Expose release configuration
        if: env.GATIT_MODE == 'release'
        shell: bash
        env:
          WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_NSIS_UPSTREAM_APPROVED: ${{ vars.SIGNPATH_NSIS_UPSTREAM_APPROVED }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/ci-export-secrets.sh WINDOWS_SIGNING_PROVIDER SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG SIGNPATH_ARTIFACT_CONFIGURATION_SLUG SIGNPATH_NSIS_UPSTREAM_APPROVED AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERTIFICATE_PROFILE WINDOWS_PUBLISHER_SUBJECT TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      - name: Require Authenticode configuration for releases
        shell: bash
        run: bash scripts/ci-build-config.sh "$GATIT_VERSION" windows "$GATIT_MODE" > build-config.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            recorder-win
      - name: Build recorder
        run: ./scripts/build-recorder-windows.ps1
      - name: Build whisper.cpp
        run: ./scripts/build-whisper-windows.ps1
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.12.3 --locked
      - name: Sign in to Azure with GitHub OIDC
        if: env.GATIT_MODE == 'release' && env.WINDOWS_SIGNING_PROVIDER == 'azure-artifact-signing'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Microsoft's signing module
        if: env.GATIT_MODE == 'release' && env.WINDOWS_SIGNING_PROVIDER == 'azure-artifact-signing'
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.20 -Scope CurrentUser -Force -Repository PSGallery
      - name: Read pinned official GitHub artifact uploader
        if: env.GATIT_MODE == 'release' && env.WINDOWS_SIGNING_PROVIDER == 'signpath-foundation'
        uses: actions/checkout@v4
        with:
          repository: actions/upload-artifact
          ref: ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
          path: .build/upload-action
          persist-credentials: false
      - name: Read pinned official SignPath action
        if: env.GATIT_MODE == 'release' && env.WINDOWS_SIGNING_PROVIDER == 'signpath-foundation'
        uses: actions/checkout@v4
        with:
          repository: SignPath/github-action-submit-signing-request
          ref: f6d04783b4569d051e0c80105fe66e82819d0092 # v3
          path: .build/signpath-action
          persist-credentials: false
      - name: Build CI installer
        if: env.GATIT_MODE != 'release'
        uses: ./.github/actions/build-windows
      - name: Build and sign release installer
        if: env.GATIT_MODE == 'release'
        uses: ./.github/actions/build-windows
        env:
          SIGNPATH_GITHUB_TOKEN: ${{ github.token }}
      - name: Inspect CI installer payload without execution
        if: env.GATIT_MODE != 'release'
        run: ./scripts/inspect-windows-payload.ps1
      - name: Verify app, installer and packaged upstream files without executing them
        if: env.GATIT_MODE == 'release'
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1
      - name: Collect the installer and the update signature
        shell: bash
        run: bash scripts/ci-collect-windows.sh "$GATIT_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GATIT_MODE == 'release' && 'Gatit' || 'CI-unsigned-Gatit' }}-windows
          path: |
            Gatit-windows-setup.exe
            Gatit-windows-setup.exe.sig
            Gatit-windows.verification.json

  release:
    name: Publish downloads
    needs: [test, mac, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: Gatit-*
          path: dist
          merge-multiple: true
      - name: Require verified artifacts for every platform
        run: python3 scripts/release-manifest.py verify dist
      - name: Write the update feed and the release notes
        run: scripts/ci-release-notes.sh "$GATIT_VERSION" dist
      - name: Replace the "latest" pre-release with this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A manual rerun of an old main commit must not replace a newer release.
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$GITHUB_SHA"
          ls -l dist
          gh release delete latest --yes --cleanup-tag
          gh release create latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Gatit $GATIT_VERSION" \
            --notes-file release-notes.md

name: Build (macOS)

on:
  push:
    branches: [main]
  pull_request:

# Every build gets a version of its own (0.1.<run number>) so the app can tell a newer one
# apart. Apple signing, notarization and update signatures switch on when the matching
# secrets exist (see docs/signing.md) and fall back to an ad-hoc build without them.
env:
  GATIT_VERSION: 0.1.${{ github.run_number }}

jobs:
  test:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: Format and lint
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --tests -- -D warnings
      - name: Unit tests (transcript merge, Hebrew search, summary parsing)
        working-directory: app/src-tauri
        run: cargo test

  build:
    name: Gatit.app (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            slug: intel
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            slug: apple-silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: .build/whisper.cpp
          key: whisper-cpp-${{ matrix.target }}-${{ hashFiles('scripts/build-whisper-mac.sh') }}
      - name: Build Swift recorder
        run: scripts/build-recorder-mac.sh ${{ matrix.target }}
      - name: Build whisper.cpp
        run: scripts/build-whisper-mac.sh ${{ matrix.target }}
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      # Tauri treats an APPLE_CERTIFICATE that is set but empty as a certificate to import, so
      # only the secrets that exist become environment variables for the build.
      - name: Expose the signing secrets that exist
        env:
          # Apple Developer ID signing and notarization (Tauri reads these itself).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the update packages the app checks for.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/ci-export-secrets.sh APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      - name: Choose signing (Developer ID when the secrets exist, ad-hoc otherwise)
        run: scripts/ci-build-config.sh "$GATIT_VERSION" > build-config.json
      - name: Build app bundle
        working-directory: app/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles app --config ../../build-config.json
      - name: Collect the app and the update package
        run: scripts/ci-collect-mac.sh ${{ matrix.target }} ${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        with:
          name: Gatit-macos-${{ matrix.slug }}
          path: |
            Gatit-macos-${{ matrix.slug }}.zip
            Gatit-macos-${{ matrix.slug }}.app.tar.gz
            Gatit-macos-${{ matrix.slug }}.app.tar.gz.sig
            Gatit-macos-${{ matrix.slug }}.signing

  release:
    name: Publish downloads
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: Gatit-*
          path: dist
          merge-multiple: true
      - name: Write the update feed and the release notes
        run: scripts/ci-release-notes.sh "$GATIT_VERSION" dist
      - name: Replace the "latest" pre-release with this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Gatit $GATIT_VERSION" \
            --notes-file release-notes.md
